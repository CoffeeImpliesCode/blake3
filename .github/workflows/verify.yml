# Verification for the Zig package in this repository.
#
# Upstream ships .github/workflows/ci.yml for its Rust crate and its CMake
# build. That file is upstream's and is left alone; this one gates the fork's
# own artifacts and names this repository's commands. The Rust CI is not
# retargeted at this fork's infrastructure.
#
# Three jobs, three different questions:
#   native      does the upstream C compile and link, do the tests and the
#               example run on this host, does the scalar-only core agree with
#               the dispatched kernels on the same vectors, and does the
#               installed header and archive serve a plain C program
#   cross       does the whole package compile for each of the six matrix
#               targets
#   consumer    does the published module resolve from a package that did not
#               write it
#
# There is no `continue-on-error` in this file and there is no matrix with a
# tolerated target. Each target is a separate step on purpose: a matrix row
# allowed to fail is indistinguishable from a target that was quietly dropped,
# and "we know that one is broken" is only a fact once a gate run has printed
# the failure. If a target ever does turn out to be unsupported here, the
# honest edit is to replace that step with a command that asserts the specific
# documented failure and to record the run in FORK-NOTES.md, not to add a flag
# that hides it.
#
# System-library mode (`-fsys=blake3` / `-Dsystem=true`) is deliberately not a
# step here: it needs an installed libblake3 with its own blake3.h, and a stock
# runner has neither. It is gated locally on a machine that has it, and a
# claim about it needs that run, not this file.
#
# The full platform matrix is a fourth gate and it is not in this file.
# `cross-test`, run from the package root, builds and *runs* `tests.zig` for
# every platform in Zig 0.16.0's published Tier 1/2 table through this
# repository's own build graph, using `cross-test.profile.sh` for its settings.
# It is not a job here because `cross-test` and its sibling helpers are a
# host-local tool with its own runner detection and its own scratch policy, not
# something a GitHub runner has; adding a job that invoked a path it does not
# have would fail for a reason that has nothing to do with this package, and
# wrapping that job in an availability check would turn a missing gate into a
# green one. So this file does not pretend to cover it and does not stand in
# for it: the `cross` job below runs nothing, and a platform with no runner on
# the host is recorded as explicit `build_only` coverage, never as a pass. The
# command and its receipts belong in README.zig.md and FORK-NOTES.md.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native build, tests and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: immutable source and fixture integrity
        run: sha256sum -c UPSTREAM.sha256

      - name: build
        run: zig build --summary all

      # A real gate for the installed C surface. This translation unit
      # includes the *installed* header, calls every hasher routine it
      # declares except the oneTBB entry (which this build never defines,
      # upstream's own default), and links against the installed archive. A
      # declaration whose type is wrong fails to compile; a declaration the
      # archive does not define fails to link.
      #
      # Every answer it checks is copied out of upstream's published
      # test_vectors/test_vectors.json: the `key` and `context_string` fields,
      # and the complete 131-byte extended outputs of the input_len 0 and
      # input_len 3 cases in all three modes. Nothing below asks whether two
      # calls into this build agree with each other, and nothing checks a
      # version string, an export list or a length, so the program passes only
      # by producing the digests upstream publishes.
      - name: installed C header compiles, links and runs
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c_surface_gate.c" <<'C'

          #include <blake3.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>

          /* Every expected string below is copied out of upstream's own published
             test_vectors/test_vectors.json, the `key`, `context_string` and case fields.
             Nothing here is derived by running this build and calling its own output
             correct. */

          /* The extended output length every published case carries, in bytes. */
          #define XOF_LEN 131

          /* The key upstream publishes with the vectors, the 32-character ASCII string
             "whats the Elvish word for friend". Taken as the bytes of that string, with
             the header's own key length deciding the cast rather than the transcription. */
          static const char official_key_text[] = "whats the Elvish word for friend";
          _Static_assert(sizeof official_key_text - 1 == BLAKE3_KEY_LEN,
                         "the published key is exactly one key long");
          static const uint8_t *const official_key = (const uint8_t *)official_key_text;

          /* The context string upstream publishes, byte for byte. */
          static const char official_context[] =
              "BLAKE3 2019-12-27 16:29:52 test vectors context";
          _Static_assert(sizeof official_context - 1 == 47,
                         "the published context is 47 bytes");

          /* input_len 0, complete 131-byte extended output, one per mode. */
          static const char empty_hash[] =
              "af1349b9f5f9a1a6a0404dea36dcc9499bcb25c9adc112b7cc9a93cae41f3262"
              "e00f03e7b69af26b7faaf09fcd333050338ddfe085b8cc869ca98b206c08243a"
              "26f5487789e8f660afe6c99ef9e0c52b92e7393024a80459cf91f476f9ffdbda"
              "7001c22e159b402631f277ca96f2defdf1078282314e763699a31c5363165421"
              "cce14d";

          static const char empty_keyed[] =
              "92b2b75604ed3c761f9d6f62392c8a9227ad0ea3f09573e783f1498a4ed60d26"
              "b18171a2f22a4b94822c701f107153dba24918c4bae4d2945c20ece13387627d"
              "3b73cbf97b797d5e59948c7ef788f54372df45e45e4293c7dc18c1d41144a975"
              "8be58960856be1eabbe22c2653190de560ca3b2ac4aa692a9210694254c371e8"
              "51bc8f";

          static const char empty_derive[] =
              "2cc39783c223154fea8dfb7c1b1660f2ac2dcbd1c1de8277b0b0dd39b7e50d7d"
              "905630c8be290dfcf3e6842f13bddd573c098c3f17361f1f206b8cad9d088aa4"
              "a3f746752c6b0ce6a83b0da81d59649257cdf8eb3e9f7d4998e41021fac119de"
              "efb896224ac99f860011f73609e6e0e4540f93b273e56547dfd3aa1a035ba668"
              "9d89a0";

          /* input_len 3, complete 131-byte extended output, one per mode. Byte i of
             every published input is i mod 251, so this case's input is 0, 1, 2. */
          static const char three_hash[] =
              "e1be4d7a8ab5560aa4199eea339849ba8e293d55ca0a81006726d184519e647f"
              "5b49b82f805a538c68915c1ae8035c900fd1d4b13902920fd05e1450822f36de"
              "9454b7e9996de4900c8e723512883f93f4345f8a58bfe64ee38d3ad71ab02776"
              "5d25cdd0e448328a8e7a683b9a6af8b0af94fa09010d9186890b096a08471e42"
              "30a134";

          static const char three_keyed[] =
              "39e67b76b5a007d4921969779fe666da67b5213b096084ab674742f0d5ec62b9"
              "b9142d0fab08e1b161efdbb28d18afc64d8f72160c958e53a950cdecf91c1a1b"
              "bab1a9c0f01def762a77e2e8545d4dec241e98a89b6db2e9a5b070fc110caae2"
              "622690bd7b76c02ab60750a3ea75426a6bb8803c370ffe465f07fb57def95df7"
              "72c39f";

          static const char three_derive[] =
              "440aba35cb006b61fc17c0529255de438efc06a8c9ebf3f2ddac3b5a86705797"
              "f27e2e914574f4d87ec04c379e12789eccbfbc15892626042707802dbe4e97c3"
              "ff59dca80c1e54246b6d055154f7348a39b7d098b2b4824ebe90e104e763b2a4"
              "47512132cede16243484a55a4e40a85790038bb0dcf762e8c053cabae41bbe22"
              "a5bff7";

          static const uint8_t three_input[3] = {0, 1, 2};

          /* Two whole chunks and one more byte. Long enough that whole chunks have been
             compressed and their chaining values are on the CV stack when reset runs,
             so a reset that cleared only the block buffer would leave them behind. */
          #define POISON_LEN (2 * BLAKE3_CHUNK_LEN + 1)

          static uint8_t poison[POISON_LEN];

          /* Compare the first `len` bytes of `got` with the first 2*len characters of
             `want`, which is always one of the complete published outputs above. A short
             read and a long read therefore answer the same literal rather than each
             getting its own transcribed copy. */
          static int check_hex(const uint8_t *got, size_t len, const char *want) {
              static const char digits[] = "0123456789abcdef";
              char buf[2 * XOF_LEN + 1];
              size_t i;
              if (len > XOF_LEN) {
                  printf("asked for %zu bytes, wider than the published window\n", len);
                  return 1;
              }
              for (i = 0; i < len; i++) {
                  buf[2 * i] = digits[got[i] >> 4];
                  buf[2 * i + 1] = digits[got[i] & 0x0f];
              }
              buf[2 * len] = '\0';
              if (strncmp(buf, want, 2 * len) != 0) {
                  printf("got  %s\nwant %.*s\n", buf, (int)(2 * len), want);
                  return 1;
              }
              return 0;
          }

          int main(void) {
              blake3_hasher self;
              uint8_t out[XOF_LEN];
              uint8_t window[XOF_LEN];

              /* Hashing nothing: the default 32-byte output and the whole 131-byte
                 extended output, both against the published input_len 0 answer. */
              blake3_hasher_init(&self);
              blake3_hasher_update(&self, "", 0);
              blake3_hasher_finalize(&self, out, BLAKE3_OUT_LEN);
              if (check_hex(out, BLAKE3_OUT_LEN, empty_hash)) return 1;
              blake3_hasher_finalize(&self, window, sizeof window);
              if (check_hex(window, sizeof window, empty_hash)) return 1;

              /* The same extended output read at an offset. 65 is one byte into the
                 second 64-byte block, so the window this call returns starts inside a
                 block it does not begin, and the answer is read out of the published
                 string at the same offset. */
              blake3_hasher_finalize_seek(&self, 65, window, sizeof window - 65);
              if (check_hex(window, sizeof window - 65, empty_hash + 2 * 65)) return 1;

              /* Keyed hashing under the key upstream published, not an invented one. */
              blake3_hasher_init_keyed(&self, official_key);
              blake3_hasher_update(&self, "", 0);
              blake3_hasher_finalize(&self, out, BLAKE3_OUT_LEN);
              if (check_hex(out, BLAKE3_OUT_LEN, empty_keyed)) return 1;
              blake3_hasher_finalize(&self, window, sizeof window);
              if (check_hex(window, sizeof window, empty_keyed)) return 1;

              /* Both context spellings, each held to the published derive_key answer in
                 its own right rather than to the other spelling's output. Upstream
                 publishes no context containing a NUL, so there is no published answer
                 for one to be compared against here; that behaviour is held by the Zig
                 suite, which checks a NUL-bearing context against its own truncation. */
              blake3_hasher_init_derive_key(&self, official_context);
              blake3_hasher_update(&self, "", 0);
              blake3_hasher_finalize(&self, out, BLAKE3_OUT_LEN);
              if (check_hex(out, BLAKE3_OUT_LEN, empty_derive)) return 1;
              blake3_hasher_finalize(&self, window, sizeof window);
              if (check_hex(window, sizeof window, empty_derive)) return 1;

              blake3_hasher_init_derive_key_raw(&self, official_context,
                                                sizeof official_context - 1);
              blake3_hasher_update(&self, "", 0);
              blake3_hasher_finalize(&self, out, BLAKE3_OUT_LEN);
              if (check_hex(out, BLAKE3_OUT_LEN, empty_derive)) return 1;
              blake3_hasher_finalize(&self, window, sizeof window);
              if (check_hex(window, sizeof window, empty_derive)) return 1;

              /* Segmented updates against an answer this build did not produce: upstream
                 publishes input_len 3, whose input is the three bytes 0, 1, 2. Fed one
                 byte at a time, after an empty update, the digest is still the published
                 one. */
              blake3_hasher_init(&self);
              blake3_hasher_update(&self, three_input, 0);
              blake3_hasher_update(&self, three_input + 0, 1);
              blake3_hasher_update(&self, three_input + 1, 1);
              blake3_hasher_update(&self, three_input + 2, 1);
              blake3_hasher_finalize(&self, out, sizeof out);
              if (check_hex(out, sizeof out, three_hash)) return 1;

              /* The same case in the other two modes, split two and one. */
              blake3_hasher_init_keyed(&self, official_key);
              blake3_hasher_update(&self, three_input, 2);
              blake3_hasher_update(&self, three_input + 2, 1);
              blake3_hasher_finalize(&self, out, BLAKE3_OUT_LEN);
              if (check_hex(out, BLAKE3_OUT_LEN, three_keyed)) return 1;

              blake3_hasher_init_derive_key(&self, official_context);
              blake3_hasher_update(&self, three_input, 1);
              blake3_hasher_update(&self, three_input + 1, 2);
              blake3_hasher_finalize(&self, out, BLAKE3_OUT_LEN);
              if (check_hex(out, BLAKE3_OUT_LEN, three_derive)) return 1;

              /* reset has to empty the whole state, and keep the mode it was set up
                 with: after two chunks and a byte of poison, the unkeyed, keyed and
                 derive-key hashers each answer their own published empty-input digest,
                 so a reset that kept the stack, or dropped the key, would not get here
                 clean. */
              memset(poison, 0xa5, sizeof poison);

              blake3_hasher_init(&self);
              blake3_hasher_update(&self, poison, sizeof poison);
              blake3_hasher_reset(&self);
              blake3_hasher_finalize(&self, out, BLAKE3_OUT_LEN);
              if (check_hex(out, BLAKE3_OUT_LEN, empty_hash)) return 1;

              blake3_hasher_init_keyed(&self, official_key);
              blake3_hasher_update(&self, poison, sizeof poison);
              blake3_hasher_reset(&self);
              blake3_hasher_finalize(&self, out, BLAKE3_OUT_LEN);
              if (check_hex(out, BLAKE3_OUT_LEN, empty_keyed)) return 1;

              blake3_hasher_init_derive_key_raw(&self, official_context,
                                                sizeof official_context - 1);
              blake3_hasher_update(&self, poison, sizeof poison);
              blake3_hasher_reset(&self);
              blake3_hasher_finalize(&self, out, BLAKE3_OUT_LEN);
              if (check_hex(out, BLAKE3_OUT_LEN, empty_derive)) return 1;

              printf("public C surface compiled, linked and ran\n");
              return 0;
          }
          C
          zig cc -std=gnu11 \
            -I zig-out/include \
            "$RUNNER_TEMP/c_surface_gate.c" \
            zig-out/lib/libblake3.a \
            -o "$RUNNER_TEMP/c_surface_gate"
          "$RUNNER_TEMP/c_surface_gate"

      - name: test (Debug)
        run: zig build test

      - name: test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

      # The scalar core, same facade, same official vectors. A disagreement
      # here is a real defect in the dispatched kernels, not a difference in
      # the tests.
      - name: test (scalar core only, -Dportable=true)
        run: zig build test -Dportable=true

      - name: smoke
        run: zig build smoke

      - name: smoke (scalar core only, -Dportable=true)
        run: zig build smoke -Dportable=true

  cross:
    name: cross-target compile matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Six separate steps, six separate targets, no tolerated failure. Each
      # one compiles the whole package for that target: the C core with the
      # kernels that target can use, the translated header, the facade, the
      # tests and the example. Nothing is run, so a green step is compile
      # evidence and not a claim that a foreign binary executed.
      - name: check x86_64-linux-gnu
        run: zig build check -Dtarget=x86_64-linux-gnu --summary all

      - name: check aarch64-linux-gnu
        run: zig build check -Dtarget=aarch64-linux-gnu --summary all

      - name: check aarch64-macos-none
        run: zig build check -Dtarget=aarch64-macos-none --summary all

      - name: check x86_64-windows-gnu
        run: zig build check -Dtarget=x86_64-windows-gnu --summary all

      - name: check riscv64-linux-gnu
        run: zig build check -Dtarget=riscv64-linux-gnu --summary all

      - name: check wasm32-wasi
        run: zig build check -Dtarget=wasm32-wasi --summary all

  consumer:
    name: consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The failure this catches is the one the library's own tests cannot
      # see: a module that builds from the inside and does not resolve from
      # outside.
      - name: run
        working-directory: consumer
        run: zig build run
